                  paint.setShader(null);
                  paint.setColor(Color.rgb(9, 8, 20));
                  canvas.drawRect(0, 0, 960, 540, paint);

                  paint.setColor(Color.rgb(20, 16, 42));
                  canvas.drawCircle(170, 130, 95, paint);
                  canvas.drawCircle(780, 370, 145, paint);

                  paint.setColor(Color.rgb(50, 24, 70));
                  canvas.drawRect(0, 430, 960, 540, paint);

                  paint.setColor(Color.rgb(110, 45, 110));
                  for (int i = 0; i < 18; i++) {
                      float x = (i * 83) % 960;
                      float y = 30 + ((i * 47) % 370);
                      canvas.drawCircle(x, y, 2.5f, paint);
                  }
              }

