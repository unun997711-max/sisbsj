      - name: Generate ILARION LAN Multiplayer System
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/ilarion/game
          cat > app/src/main/java/com/ilarion/game/LanMultiplayer.java <<'EOF'
          package com.ilarion.game;

          import java.io.BufferedReader;
          import java.io.BufferedWriter;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.io.IOException;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.SocketException;
          import java.net.Inet4Address;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class LanMultiplayer {

              public static final int DEFAULT_PORT = 27840;
              public static final int MAX_PLAYERS = 4;

              public interface Listener {
                  void onConnected(int playerId);
                  void onDisconnected();
                  void onPlayerUpdated(PlayerState player);
                  void onPlayerLeft(int playerId);
                  void onMessage(String message);
                  void onError(String error);
              }

              public static class PlayerState {
                  public final int id;
                  public final float x;
                  public final float y;
                  public final int health;
                  public final String action;

                  public PlayerState(int id, float x, float y,
                                     int health, String action) {
                      this.id = id;
                      this.x = x;
                      this.y = y;
                      this.health = health;
                      this.action = action == null ? "idle" : action;
                  }
              }

              private final AtomicBoolean running = new AtomicBoolean(false);
              private final AtomicBoolean connected = new AtomicBoolean(false);

              private final Map<Integer, PlayerState> players =
                      new ConcurrentHashMap<>();

              private final Map<Integer, ClientHandler> clients =
                      new ConcurrentHashMap<>();

              private volatile Listener listener;
              private volatile boolean host;
              private volatile int localPlayerId = -1;

              private volatile ServerSocket serverSocket;
              private volatile Socket clientSocket;
              private volatile BufferedReader clientReader;
              private volatile BufferedWriter clientWriter;

              private volatile Thread serverThread;
              private volatile Thread clientReadThread;

              private final Object clientWriteLock = new Object();
              private final Object broadcastLock = new Object();

              public LanMultiplayer(Listener listener) {
                  this.listener = listener;
              }

              public void setListener(Listener listener) {
                  this.listener = listener;
              }

              public boolean isHost() {
                  return host;
              }

              public boolean isConnected() {
                  return connected.get();
              }

              public int getLocalPlayerId() {
                  return localPlayerId;
              }

              public int getPlayerCount() {
                  return players.size();
              }

              public List<PlayerState> getPlayers() {
                  return Collections.unmodifiableList(
                          new ArrayList<>(players.values()));
              }

              public PlayerState getPlayer(int id) {
                  return players.get(id);
              }

              private void notifyMessage(String message) {
                  Listener callback = listener;
                  if (callback != null) {
                      callback.onMessage(message);
                  }
              }

              private void notifyError(String message) {
                  Listener callback = listener;
                  if (callback != null) {
                      callback.onError(message);
                  }
              }

              private void notifyConnected(int id) {
                  Listener callback = listener;
                  if (callback != null) {
                      callback.onConnected(id);
                  }
              }

              private void notifyDisconnected() {
                  Listener callback = listener;
                  if (callback != null) {
                      callback.onDisconnected();
                  }
              }

              private void notifyPlayerUpdated(PlayerState player) {
                  Listener callback = listener;
                  if (callback != null) {
                      callback.onPlayerUpdated(player);
                  }
              }

              private void notifyPlayerLeft(int id) {
                  Listener callback = listener;
                  if (callback != null) {
                      callback.onPlayerLeft(id);
                  }
              }

              public synchronized boolean startHost() {
                  return startHost(DEFAULT_PORT);
              }

              public synchronized boolean startHost(int port) {
                  if (running.get()) {
                      notifyError("يوجد اتصال أو غرفة نشطة بالفعل.");
                      return false;
                  }

                  if (port < 1024 || port > 65535) {
                      notifyError("رقم المنفذ غير صالح.");
                      return false;
                  }

                  try {
                      serverSocket = new ServerSocket(port);
                      serverSocket.setReuseAddress(true);

                      host = true;
                      localPlayerId = 0;
                      running.set(true);
                      connected.set(true);

                      players.clear();
                      clients.clear();

                      players.put(0, new PlayerState(
                              0, 0, 0, 100, "idle"));

                      serverThread = new Thread(
                              this::acceptClients, "ILARION-LAN-Server");
                      serverThread.start();

                      notifyConnected(0);
                      notifyMessage("تم إنشاء الغرفة بنجاح.");
                      return true;

                  } catch (IOException error) {
                      closeQuietly(serverSocket);
                      serverSocket = null;
                      running.set(false);
                      connected.set(false);
                      host = false;
                      localPlayerId = -1;

                      notifyError("تعذر إنشاء الغرفة: " + error.getMessage());
                      return false;
                  }
              }

              private void acceptClients() {
                  while (running.get()) {
                      Socket socket = null;

                      try {
                          socket = serverSocket.accept();
                          socket.setTcpNoDelay(true);
                          socket.setKeepAlive(true);

                          if (clients.size() >= MAX_PLAYERS - 1) {
                              sendRawAndClose(socket, "FULL");
                              continue;
                          }

                          int playerId = findFreePlayerId();

                          if (playerId < 1) {
                              sendRawAndClose(socket, "FULL");
                              continue;
                          }

                          ClientHandler handler =
                                  new ClientHandler(playerId, socket);

                          clients.put(playerId, handler);

                          PlayerState newPlayer = new PlayerState(
                                  playerId, 0, 0, 100, "idle");

                          players.put(playerId, newPlayer);

                          handler.send("WELCOME|" + playerId);

                          broadcast("PLAYER|" + playerId +
                                  "|0|0|100|idle");

                          notifyPlayerUpdated(newPlayer);
                          notifyMessage("انضم لاعب جديد: " + playerId);

                          handler.start();

                      } catch (IOException error) {
                          if (running.get()) {
                              notifyError("مشكلة في استقبال لاعب: " +
                                      error.getMessage());
                          }

                          closeQuietly(socket);
                      }
                  }
              }

              private int findFreePlayerId() {
                  for (int id = 1; id < MAX_PLAYERS; id++) {
                      if (!clients.containsKey(id)) {
                          return id;
                      }
                  }
                  return -1;
              }

              private void sendRawAndClose(Socket socket, String message) {
                  try {
                      BufferedWriter writer = new BufferedWriter(
                              new OutputStreamWriter(
                                      socket.getOutputStream()));
                      writer.write(message);
                      writer.newLine();
                      writer.flush();
                  } catch (IOException ignored) {
                  }

                  closeQuietly(socket);
              }

              private class ClientHandler extends Thread {
                  private final int playerId;
                  private final Socket socket;
                  private BufferedReader reader;
                  private BufferedWriter writer;
                  private final AtomicBoolean active =
                          new AtomicBoolean(true);
                  private final Object writeLock = new Object();

                  ClientHandler(int playerId, Socket socket) {
                      this.playerId = playerId;
                      this.socket = socket;
                      setName("ILARION-Client-" + playerId);
                  }

                  void send(String message) {
                      if (!active.get()) return;

                      synchronized (writeLock) {
                          try {
                              if (writer == null) {
                                  writer = new BufferedWriter(
                                          new OutputStreamWriter(
                                                  socket.getOutputStream()));
                              }

                              writer.write(message);
                              writer.newLine();
                              writer.flush();

                          } catch (IOException error) {
                              closeHandler();
                          }
                      }
                  }

                  @Override
                  public void run() {
                      try {
                          reader = new BufferedReader(
                                  new InputStreamReader(
                                          socket.getInputStream()));

                          while (running.get() && active.get()) {
                              String line = reader.readLine();

                              if (line == null) {
                                  break;
                              }

                              processClientMessage(playerId, line);
                          }

                      } catch (IOException error) {
                          if (running.get() && active.get()) {
                              notifyMessage(
                                      "انقطع اتصال اللاعب " + playerId);
                          }
                      } finally {
                          closeHandler();
                      }
                  }

                  void closeHandler() {
                      if (!active.compareAndSet(true, false)) return;

                      closeQuietly(socket);
                      clients.remove(playerId, this);
                      players.remove(playerId);

                      if (running.get()) {
                          broadcast("REMOVE|" + playerId);
                          notifyPlayerLeft(playerId);
                          notifyMessage("غادر اللاعب: " + playerId);
                      }
                  }
              }

              private void processClientMessage(int playerId, String line) {
                  if (line == null || line.length() > 512) return;

                  String[] parts = line.split("\\\\|", 5);

                  if (parts.length < 5 || !"STATE".equals(parts[0])) {
                      return;
                  }

                  try {
                      float x = Float.parseFloat(parts[1]);
                      float y = Float.parseFloat(parts[2]);
                      int health = Integer.parseInt(parts[3]);
                      String action = cleanAction(parts[4]);

                      if (Float.isNaN(x) || Float.isInfinite(x) ||
                          Float.isNaN(y) || Float.isInfinite(y)) {
                          return;
                      }

                      health = Math.max(0, Math.min(100, health));

                      PlayerState state = new PlayerState(
                              playerId, x, y, health, action);

                      players.put(playerId, state);

                      notifyPlayerUpdated(state);

                      broadcast("PLAYER|" + playerId + "|" +
                              x + "|" + y + "|" + health + "|" + action);

                  } catch (NumberFormatException ignored) {
                  }
              }

              public synchronized boolean joinRoom(String ipAddress) {
                  return joinRoom(ipAddress, DEFAULT_PORT);
              }

              public synchronized boolean joinRoom(
                      String ipAddress, int port) {

                  if (running.get()) {
                      notifyError("أغلق الاتصال الحالي أولاً.");
                      return false;
                  }

                  if (ipAddress == null || ipAddress.trim().isEmpty()) {
                      notifyError("أدخل عنوان IP المضيف.");
                      return false;
                  }

                  if (port < 1024 || port > 65535) {
                      notifyError("رقم المنفذ غير صالح.");
                      return false;
                  }

                  try {
                      String address = ipAddress.trim();

                      if (address.contains(":")) {
                          notifyError("أدخل IP فقط دون رقم المنفذ.");
                          return false;
                      }

                      Socket socket = new Socket();
                      socket.connect(
                              new java.net.InetSocketAddress(address, port),
                              7000);
                      socket.setTcpNoDelay(true);
                      socket.setKeepAlive(true);

                      clientSocket = socket;
                      clientReader = new BufferedReader(
                              new InputStreamReader(
                                      socket.getInputStream()));
                      clientWriter = new BufferedWriter(
                              new OutputStreamWriter(
                                      socket.getOutputStream()));

                      String welcome = clientReader.readLine();

                      if (welcome == null || !welcome.startsWith("WELCOME|")) {
                          closeQuietly(socket);
                          clientSocket = null;
                          notifyError("تعذر الانضمام إلى الغرفة.");
                          return false;
                      }

                      int assignedId = Integer.parseInt(
                              welcome.substring("WELCOME|".length()));

                      if (assignedId < 1 || assignedId >= MAX_PLAYERS) {
                          closeQuietly(socket);
                          clientSocket = null;
                          notifyError("استلمنا رقم لاعب غير صالح.");
                          return false;
                      }

                      host = false;
                      localPlayerId = assignedId;
                      running.set(true);
                      connected.set(true);

                      players.clear();
                      players.put(assignedId, new PlayerState(
                              assignedId, 0, 0, 100, "idle"));

                      clientReadThread = new Thread(
                              this::readServerMessages,
                              "ILARION-LAN-Client");
                      clientReadThread.start();

                      notifyConnected(assignedId);
                      notifyMessage("تم الانضمام إلى غرفة إيلاريون.");
                      return true;

                  } catch (Exception error) {
                      disconnect();
                      notifyError("فشل الاتصال: " + error.getMessage());
                      return false;
                  }
              }

              private void readServerMessages() {
                  try {
                      while (running.get() && clientSocket != null &&
                              !clientSocket.isClosed()) {

                          String line = clientReader.readLine();
                          if (line == null) break;

                          processServerMessage(line);
                      }

                  } catch (IOException error) {
                      if (running.get()) {
                          notifyMessage("انقطع الاتصال بالمضيف.");
                      }
                  } finally {
                      if (!host && running.get()) {
                          disconnect();
                      }
                  }
              }

              private void processServerMessage(String line) {
                  if (line == null || line.length() > 512) return;

                  String[] parts = line.split("\\\\|", 6);

                  if ("PLAYER".equals(parts[0]) && parts.length >= 6) {
                      try {
                          int id = Integer.parseInt(parts[1]);
                          float x = Float.parseFloat(parts[2]);
                          float y = Float.parseFloat(parts[3]);
                          int health = Integer.parseInt(parts[4]);
                          String action = cleanAction(parts[5]);

                          if (id < 0 || id >= MAX_PLAYERS ||
                              Float.isNaN(x) || Float.isInfinite(x) ||
                              Float.isNaN(y) || Float.isInfinite(y)) {
                              return;
                          }

                          PlayerState state = new PlayerState(
                                  id, x, y,
                                  Math.max(0, Math.min(100, health)),
                                  action);

                          players.put(id, state);
                          notifyPlayerUpdated(state);

                      } catch (NumberFormatException ignored) {
                      }

                  } else if ("REMOVE".equals(parts[0]) &&
                             parts.length >= 2) {
                      try {
                          int id = Integer.parseInt(parts[1]);
                          players.remove(id);
                          notifyPlayerLeft(id);
                      } catch (NumberFormatException ignored) {
                      }

                  } else if ("FULL".equals(parts[0])) {
                      notifyError("الغرفة ممتلئة. الحد الأقصى أربعة لاعبين.");
                      disconnect();

                  } else if ("MESSAGE".equals(parts[0]) &&
                             parts.length >= 2) {
                      notifyMessage(parts[1]);
                  }
              }

              public void sendPlayerState(
                      float x, float y, int health, String action) {

                  if (!connected.get()) return;

                  if (Float.isNaN(x) || Float.isInfinite(x) ||
                      Float.isNaN(y) || Float.isInfinite(y)) {
                      return;
                  }

                  int safeHealth = Math.max(0, Math.min(100, health));
                  String safeAction = cleanAction(action);

                  PlayerState state = new PlayerState(
                          localPlayerId, x, y, safeHealth, safeAction);

                  players.put(localPlayerId, state);
                  notifyPlayerUpdated(state);

                  String packet = "STATE|" + x + "|" + y + "|" +
                          safeHealth + "|" + safeAction;

                  if (host) {
                      broadcast("PLAYER|" + localPlayerId + "|" +
                              x + "|" + y + "|" + safeHealth + "|" +
                              safeAction);
                  } else {
                      sendToServer(packet);
                  }
              }

              private String cleanAction(String action) {
                  if (action == null || action.trim().isEmpty()) {
                      return "idle";
                  }

                  return action.replace("|", "_")
                          .replace("\\n", "_")
                          .replace("\\r", "_")
                          .substring(0, Math.min(action.length(), 32));
              }

              private void sendToServer(String message) {
                  if (!connected.get() || host) return;

                  synchronized (clientWriteLock) {
                      try {
                          if (clientWriter == null) return;

                          clientWriter.write(message);
                          clientWriter.newLine();
                          clientWriter.flush();

                      } catch (IOException error) {
                          notifyError("تعذر إرسال بيانات اللاعب.");
                          disconnect();
                      }
                  }
              }

              private void broadcast(String message) {
                  if (!host || !running.get()) return;

                  synchronized (broadcastLock) {
                      for (ClientHandler client :
                              new ArrayList<>(clients.values())) {
                          client.send(message);
                      }
                  }
              }

              public void sendRoomMessage(String message) {
                  if (!connected.get() || message == null) return;

                  String safe = message.replace("|", " ")
                          .replace("\\n", " ")
                          .replace("\\r", " ");

                  if (safe.length() > 120) {
                      safe = safe.substring(0, 120);
                  }

                  if (host) {
                      broadcast("MESSAGE|" + safe);
                      notifyMessage(safe);
                  } else {
                      sendToServer("CHAT|" + safe);
                  }
              }

              public String getLocalIpAddress() {
                  try {
                      Enumeration<NetworkInterface> interfaces =
                              NetworkInterface.getNetworkInterfaces();

                      while (interfaces.hasMoreElements()) {
                          NetworkInterface network =
                                  interfaces.nextElement();

                          if (!network.isUp() || network.isLoopback()) {
                              continue;
                          }

                          Enumeration<InetAddress> addresses =
                                  network.getInetAddresses();

                          while (addresses.hasMoreElements()) {
                              InetAddress address = addresses.nextElement();

                              if (address instanceof Inet4Address &&
                                  !address.isLoopbackAddress()) {
                                  String ip = address.getHostAddress();

                                  if (ip.startsWith("192.168.") ||
                                      ip.startsWith("10.") ||
                                      ip.startsWith("172.")) {
                                      return ip;
                                  }
                              }
                          }
                      }

                  } catch (SocketException ignored) {
                  }

                  return "IP غير متاح";
              }

              public String getRoomAddress() {
                  return getLocalIpAddress() + ":" + DEFAULT_PORT;
              }

              public synchronized void disconnect() {
                  boolean wasRunning = running.getAndSet(false);
                  connected.set(false);

                  if (host) {
                      for (ClientHandler client :
                              new ArrayList<>(clients.values())) {
                          client.active.set(false);
                          closeQuietly(client.socket);
                      }

                      clients.clear();

                      closeQuietly(serverSocket);
                      serverSocket = null;

                  } else {
                      closeQuietly(clientSocket);
                      closeQuietly(clientReader);
                      closeQuietly(clientWriter);

                      clientSocket = null;
                      clientReader = null;
                      clientWriter = null;
                  }

                  players.clear();

                  host = false;
                  localPlayerId = -1;

                  if (wasRunning) {
                      notifyDisconnected();
                  }
              }

              private void closeQuietly(Socket socket) {
                  if (socket == null) return;
                  try {
                      socket.close();
                  } catch (IOException ignored) {
                  }
              }

              private void closeQuietly(ServerSocket socket) {
                  if (socket == null) return;
                  try {
                      socket.close();
                  } catch (IOException ignored) {
                  }
              }

              private void closeQuietly(BufferedReader reader) {
                  if (reader == null) return;
                  try {
                      reader.close();
                  } catch (IOException ignored) {
                  }
              }

              private void closeQuietly(BufferedWriter writer) {
                  if (writer == null) return;
                  try {
                      writer.close();
                  } catch (IOException ignored) {
                  }
              }
          }
