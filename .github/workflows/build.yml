              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  float x = event.getX() / scaleX;
                  float y = event.getY() / scaleY;

                  if (event.getAction() == MotionEvent.ACTION_DOWN) {
                      touchX = x;
                      touchY = y;

                      if (screen == GAME) {
                          return handleGameTouch(x, y, event);
                      }

                      return true;
                  }

                  if (event.getAction() == MotionEvent.ACTION_MOVE) {
                      if (screen == GAME) {
                          updateMovement(x);
                      }
                      return true;
                  }

                  if (event.getAction() == MotionEvent.ACTION_UP ||
                      event.getAction() == MotionEvent.ACTION_CANCEL) {

                      movingLeft = false;
                      movingRight = false;

                      if (screen != GAME) {
                          handleMenuTouch(x, y);
                      }

                      invalidate();
                      return true;
                  }

                  return true;
              }

              private boolean handleGameTouch(
                      float x, float y, MotionEvent event) {

                  if (pauseButton != null &&
                      pauseButton.contains(x, y)) {
                      pauseGame();
                      return true;
                  }

                  if (!controlsEnabled) return true;

                  if (leftButton != null && leftButton.contains(x, y)) {
                      movingLeft = true;
                      if (listener != null) listener.onMove(-1f);
                      return true;
                  }

                  if (rightButton != null && rightButton.contains(x, y)) {
                      movingRight = true;
                      if (listener != null) listener.onMove(1f);
                      return true;
                  }

                  if (jumpButton != null && jumpButton.contains(x, y)) {
                      if (listener != null) listener.onJump();
                      playTone(ToneGenerator.TONE_PROP_ACK);
                      return true;
                  }

                  if (attackButton != null && attackButton.contains(x, y)) {
                      if (listener != null) listener.onAttack();
                      playTone(ToneGenerator.TONE_PROP_NACK);
                      return true;
                  }

                  return true;
              }

              private void updateMovement(float x) {
                  if (leftButton != null && leftButton.contains(x, touchY)) {
                      movingLeft = true;
                      movingRight = false;
                      if (listener != null) listener.onMove(-1f);

                  } else if (rightButton != null &&
                             rightButton.contains(x, touchY)) {
                      movingRight = true;
                      movingLeft = false;
                      if (listener != null) listener.onMove(1f);
                  }
              }

              private void handleMenuTouch(float x, float y) {
                  if (screen == MENU) {
                      if (singleButton != null &&
                          singleButton.contains(x, y)) {
                          if (listener != null) {
                              listener.onStartSinglePlayer();
                          }
                          showGame();
                          return;
                      }

                      if (hostButton != null &&
                          hostButton.contains(x, y)) {
                          if (listener != null) {
                              listener.onCreateRoom();
                          }
                          showRoom();
                          return;
                      }

                      if (joinButton != null &&
                          joinButton.contains(x, y)) {
                          showJoinDialog();
                          return;
                      }

                      if (soundButton != null &&
                          soundButton.contains(x, y)) {
                          toggleSound();
                      }

                  } else if (screen == PAUSED) {
                      if (resumeButton != null &&
                          resumeButton.contains(x, y)) {
                          resumeGame();
                          return;
                      }

                      if (soundButton != null &&
                          soundButton.contains(x, y)) {
                          toggleSound();
                          return;
                      }

                      if (hostButton != null &&
                          hostButton.contains(x, y)) {
                          screen = MENU;
                          invalidate();
                      }

                  } else if (screen == ROOM) {
                      if (resumeButton != null &&
                          resumeButton.contains(x, y)) {
                          showGame();
                          return;
                      }

                      if (hostButton != null &&
                          hostButton.contains(x, y)) {
                          screen = MENU;
                          invalidate();
                      }
                  }
              }

              private void showJoinDialog() {
                  final EditText input = new EditText(getContext());
                  input.setSingleLine(true);
                  input.setHint("مثال: 192.168.1.5");
                  input.setInputType(
                          android.text.InputType.TYPE_CLASS_TEXT |
                          android.text.InputType.TYPE_TEXT_VARIATION_URI);

                  new AlertDialog.Builder(getContext())
                          .setTitle("الانضمام إلى غرفة")
                          .setMessage("أدخل عنوان IP الخاص بالمضيف")
                          .setView(input)
                          .setNegativeButton("إلغاء", (dialog, which) -> {
                              dialog.dismiss();
                          })
                          .setPositiveButton("اتصال", (dialog, which) -> {
                              String ip = input.getText().toString().trim();

                              if (ip.isEmpty()) {
                                  Toast.makeText(getContext(),
                                          "أدخل عنوان IP أولاً",
                                          Toast.LENGTH_SHORT).show();
                                  return;
                              }

                              if (listener != null) {
                                  listener.onJoinRoom(ip);
                              }
                          })
                          .show();
              }

              private void toggleSound() {
                  soundEnabled = !soundEnabled;

                  preferences.edit()
                          .putBoolean("sound_enabled", soundEnabled)
                          .apply();

                  if (soundEnabled) {
                      playTone(ToneGenerator.TONE_PROP_ACK);
                  }

                  invalidate();
              }

              public void setControlsEnabled(boolean enabled) {
                  controlsEnabled = enabled;

                  preferences.edit()
                          .putBoolean("controls_enabled", enabled)
                          .apply();

                  invalidate();
              }

              public void saveCampaign(StoryCampaign campaign) {
                  if (campaign == null) return;

                  preferences.edit()
                          .putString("campaign_progress",
                                  campaign.exportProgress())
                          .apply();
              }

              public boolean loadCampaign(StoryCampaign campaign) {
                  if (campaign == null) return false;

                  String saved = preferences.getString(
                          "campaign_progress", null);

                  if (saved == null) return false;

                  return campaign.importProgress(saved);
              }

              public void savePlayerData(
                      int level, int experience, int coins) {

                  preferences.edit()
                          .putInt("player_level", Math.max(1, level))
                          .putInt("player_experience",
                                  Math.max(0, experience))
                          .putInt("player_coins", Math.max(0, coins))
                          .apply();
              }

              public int getSavedLevel() {
                  return preferences.getInt("player_level", 1);
              }

              public int getSavedExperience() {
                  return preferences.getInt("player_experience", 0);
              }

              public int getSavedCoins() {
                  return preferences.getInt("player_coins", 0);
              }

              public void clearSavedData() {
                  preferences.edit().clear().apply();
              }

              public static GameUI attach(
                      Activity activity,
                      View gameView,
                      Listener listener) {

                  if (activity == null || gameView == null) {
                      throw new IllegalArgumentException(
                              "Activity and gameView are required");
                  }

                  FrameLayout root = new FrameLayout(activity);

                  ViewGroup parent = (ViewGroup) gameView.getParent();

                  if (parent != null) {
                      parent.removeView(gameView);
                  }

                  root.addView(gameView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                  GameUI overlay = new GameUI(activity);
                  overlay.setListener(listener);

                  root.addView(overlay,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                  activity.setContentView(root);

                  return overlay;
              }

              public void release() {
                  try {
                      tone.release();
                  } catch (Exception ignored) {
                  }
              }
          }
