                  }
              }

              private void playTone(int toneType) {
                  if (soundEnabled && tone != null) {
                      try {
                          tone.startTone(toneType, 100);
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void rounded(Canvas canvas, RectF rect,
                                   int color, float radius) {
                  paint.setColor(color);
                  paint.setStyle(Paint.Style.FILL);
                  canvas.drawRoundRect(rect, radius, radius, paint);
              }

              private void drawText(Canvas canvas, String text,
                                    float x, float y, float size,
                                    int color) {
                  paint.setColor(color);
                  paint.setTextSize(size);
                  paint.setTypeface(
                          android.graphics.Typeface.create(
                                  "sans-serif", android.graphics.Typeface.BOLD));
                  canvas.drawText(text, x, y, paint);
              }

              private RectF button(float centerX, float centerY,
                                   float width, float height) {
                  return new RectF(
                          centerX - width / 2f,
                          centerY - height / 2f,
                          centerX + width / 2f,
                          centerY + height / 2f);
              }

              private void drawButton(Canvas canvas, RectF rect,
                                      String label, int color,
                                      float textSize) {
                  rounded(canvas, rect, color, 18f);
                  drawText(canvas, label,
                          rect.centerX(),
                          rect.centerY() + textSize * 0.34f,
                          textSize, Color.WHITE);
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);

                  float width = getWidth();
                  float height = getHeight();

                  if (width <= 0 || height <= 0) return;

                  scaleX = width / 960f;
                  scaleY = height / 540f;

                  canvas.save();
                  canvas.scale(scaleX, scaleY);

                  if (screen == MENU) {
                      drawMainMenu(canvas);
                  } else if (screen == GAME) {
                      drawGameControls(canvas);
                  } else if (screen == PAUSED) {
                      drawPauseMenu(canvas);
                  } else if (screen == ROOM) {
                      drawRoomMenu(canvas);
                  }

                  canvas.restore();
              }

