      - name: Generate ILARION Combat System
        run: |
          cat > app/src/main/java/com/ilarion/game/CombatSystem.java <<'EOF'
          package com.ilarion.game;

          public final class CombatSystem {

              public static final int FIRST_BLADE = 0;
              public static final int STORM_LANTERN = 1;
              public static final int DAWN_THREAD = 2;
              public static final int VOID_BITE = 3;
              public static final int HELL_HEART = 4;

              public static class Fighter {
                  public float x;
                  public float y;
                  public float health = 100;
                  public float maxHealth = 100;
                  public float energy = 100;
                  public float attackCooldown;
                  public float invulnerability;
                  public float velocityX;
                  public float velocityY;

                  public boolean grounded = true;
                  public boolean facingLeft;
                  public boolean attacking;
                  public boolean alive = true;

                  public int weapon = FIRST_BLADE;
                  public int character = 0;
                  public int animationFrame;

                  public void update(float dt) {
                      attackCooldown = Math.max(
                          0, attackCooldown - dt
                      );

                      invulnerability = Math.max(
                          0, invulnerability - dt
                      );

                      energy = Math.min(
                          100, energy + 8 * dt
                      );

                      x += velocityX * dt;
                      y += velocityY * dt;

                      velocityX *= Math.max(0, 1 - dt * 7);

                      if (!grounded) {
                          velocityY += 950 * dt;
                      }

                      if (health <= 0) {
                          health = 0;
                          alive = false;
                      }

                      animationFrame++;
                  }

                  public boolean jump() {
                      if (!alive || !grounded) return false;

                      velocityY = -440;
                      grounded = false;
                      return true;
                  }

                  public void land(float groundY) {
                      if (y >= groundY) {
                          y = groundY;
                          velocityY = 0;
                          grounded = true;
                      }
                  }

                  public boolean takeDamage(float damage) {
                      if (!alive || invulnerability > 0) {
                          return false;
                      }

                      health -= damage;
                      invulnerability = 0.8f;

                      if (health <= 0) {
                          health = 0;
                          alive = false;
                      }

                      return true;
                  }

                  public void heal(float amount) {
                      if (!alive) return;
                      health = Math.min(maxHealth, health + amount);
                  }
              }

              public static class Attack {
                  public int weapon;
                  public float damage;
                  public float range;
                  public float energyCost;
                  public float duration;

                  public Attack(int weapon, float damage,
                                float range, float energyCost,
                                float duration) {
                      this.weapon = weapon;
                      this.damage = damage;
                      this.range = range;
                      this.energyCost = energyCost;
                      this.duration = duration;
                  }
              }

              public static Attack createAttack(Fighter fighter) {
                  switch (fighter.weapon) {
                      case STORM_LANTERN:
                          return new Attack(
                              STORM_LANTERN, 42, 210, 18, 0.55f
                          );

                      case DAWN_THREAD:
                          return new Attack(
                              DAWN_THREAD, 28, 180, 12, 0.45f
                          );

                      case VOID_BITE:
                          return new Attack(
                              VOID_BITE, 65, 140, 30, 0.8f
                          );

                      case HELL_HEART:
                          return new Attack(
                              HELL_HEART, 80, 190, 40, 1.0f
                          );

                      default:
                          return new Attack(
                              FIRST_BLADE, 35, 100, 0, 0.35f
                          );
                  }
              }

              public static boolean attack(
                  Fighter fighter,
                  GameWorld world
              ) {
                  if (!fighter.alive ||
                      fighter.attackCooldown > 0) {
                      return false;
                  }

                  Attack attack = createAttack(fighter);

                  if (fighter.energy < attack.energyCost) {
                      return false;
                  }

                  fighter.energy -= attack.energyCost;
                  fighter.attackCooldown = attack.duration;
                  fighter.attacking = true;

                  float direction = fighter.facingLeft ? -1 : 1;

                  for (GameWorld.Enemy enemy :
                       world.getEnemies()) {

                      float distance = enemy.x - fighter.x;

                      boolean inFront =
                          direction * distance >= 0;

                      if (inFront &&
                          Math.abs(distance) <= attack.range) {

                          enemy.damage(attack.damage);

                          world.createHitEffect(
                              enemy.x, enemy.y - 35
                          );

                          if (!enemy.alive) {
                              world.createDeathEffect(
                                  enemy.x, enemy.y - 35
                              );
                          }
                      }
                  }

                  return true;
              }

              public static void changeWeapon(
                  Fighter fighter, int weapon
              ) {
                  if (weapon < FIRST_BLADE ||
                      weapon > HELL_HEART) {
                      return;
                  }

                  fighter.weapon = weapon;
              }

              private CombatSystem() {}
          }
