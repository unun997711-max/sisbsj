
name: ILARION - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ilarion-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build ILARION Android Game
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ILARION PARTS 2-9 WILL BE INSERTED HERE
      # DO NOT REMOVE THIS POSITION

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ILARION-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/ilarion/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ILARION"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ilarion.game'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ilarion.game'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="ILARION"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#080710</item>
                  <item name="android:statusBarColor">#080710</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate ILARION Game Engine
        run: |
          cat > app/src/main/java/com/ilarion/game/MainActivity.java <<'EOF'
          package com.ilarion.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.MotionEvent;
          import android.view.Window;
          import android.view.WindowManager;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.RectF;
          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;
          import java.util.Random;

          public class MainActivity extends Activity {

              private GameView game;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  game = new GameView(this);
                  setContentView(game);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (game != null) game.pause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (game != null) game.resume();
              }

              @Override
              public void onBackPressed() {
                  if (game != null) {
                      game.back();
                  } else {
                      super.onBackPressed();
                  }
              }
          }

          class GameView extends View {

              private final Paint p = new Paint();
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Random random = new Random();

              private boolean running = true;
              private boolean attacking = false;
              private boolean movingLeft = false;
              private boolean movingRight = false;

              private int scene = 0;
              private int episode = 1;
              private int dialogue = 0;
              private int playerHealth = 100;
              private int enemyHealth = 100;

              private float playerX = 180;
              private float playerY = 0;
              private float velocityY = 0;
              private float cameraX = 0;
              private float ground;
              private float scale = 1;

              private long lastFrame = 0;
              private long animationTime = 0;

              private String character = "LEVI";
              private String currentSpeaker = "NARRATOR";
              private String currentText = "Welcome to ILARION.";

              private final String[] intro = {
                  "بعد المواجهة المرعبة، لم تعد أركاديا كما كانت.",
                  "ظهر أزراييل، ملك الفراغ، أمام ابنه ليفاي.",
                  "ثمانية عشر عاماً مرت منذ آخر لقاء.",
                  "لكن العهد القديم انتهى.",
                  "الأسلحة الملعونة بدأت تستجيب لأصوات مجهولة.",
                  "والسايركس أصبحت أكثر عدوانية.",
                  "وفي أعماق العالم بدأت أربعة عروش تستيقظ.",
                  "لقد بدأت حرب الآلهة."
              };

              private final Runnable frameTask = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) return;
                      long now = System.nanoTime();
                      if (lastFrame != 0) {
                          float dt = Math.min(
                              (now - lastFrame) / 1000000000f,
                              0.05f
                          );
                          updateGame(dt);
                      }
                      lastFrame = now;
                      invalidate();
                      handler.postDelayed(this, 16);
                  }
              };

              public GameView(Context context) {
                  super(context);
                  setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                  setFocusable(true);
              }

              public void pause() {
                  running = false;
                  handler.removeCallbacks(frameTask);
              }

              public void resume() {
                  if (!running) {
                      running = true;
                      lastFrame = 0;
                      handler.post(frameTask);
                  }
              }

              public void back() {
                  if (scene != 0) {
                      scene = 0;
                      invalidate();
                  }
              }

              private void updateGame(float dt) {
                  animationTime += (long)(dt * 1000);

                  if (scene != 2) return;

                  if (movingLeft) playerX -= 210 * dt;
                  if (movingRight) playerX += 210 * dt;

                  if (playerX < 30) playerX = 30;

                  velocityY += 950 * dt;
                  playerY += velocityY * dt;

                  float floor = ground - 70;

                  if (playerY > floor) {
                      playerY = floor;
                      velocityY = 0;
                  }

                  cameraX = Math.max(0, playerX - getWidth() * 0.38f);

                  if (attacking && enemyHealth > 0) {
                      enemyHealth -= 1;
                      if (enemyHealth < 0) enemyHealth = 0;
                  }
              }

              private void color(int c) {
                  p.setColor(c);
                  p.setStyle(Paint.Style.FILL);
                  p.setStrokeWidth(1);
                  p.setAntiAlias(false);
              }

              private void rect(Canvas c, float x, float y,
                                float w, float h, int col) {
                  color(col);
                  c.drawRect(x, y, x + w, y + h, p);
              }

              private void pixel(Canvas c, float x, float y,
                                 float size, int col) {
                  rect(c, x, y, size, size, col);
              }

              private void text(Canvas c, String value,
                                float x, float y, float size, int col) {
                  color(col);
                  p.setAntiAlias(true);
                  p.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                  p.setTextSize(size);
                  c.drawText(value, x, y, p);
                  p.setAntiAlias(false);
              }

              private void drawBackground(Canvas c) {
                  c.drawColor(Color.rgb(8, 12, 23));

                  float w = getWidth();
                  float h = getHeight();

                  rect(c, 0, h * 0.55f, w, h * 0.45f,
                      Color.rgb(13, 25, 30));

                  for (int i = 0; i < 14; i++) {
                      float x = (i * 173 - cameraX * 0.18f) % (w + 200);
                      if (x < -100) x += w + 200;

                      int treeHeight = 90 + (i * 37 % 110);

                      rect(c, x, h * 0.55f - treeHeight,
                          12, treeHeight, Color.rgb(19, 43, 40));

                      rect(c, x - 22, h * 0.55f - treeHeight - 15,
                          55, 38, Color.rgb(22, 65, 55));

                      pixel(c, x - 15, h * 0.55f - treeHeight - 10,
                          5, Color.rgb(70, 130, 90));
                  }

                  for (int i = 0; i < 45; i++) {
                      float x = (i * 97 + animationTime / 35f) % w;
                      float y = (i * 53) % (int)(h * 0.65f);

                      pixel(c, x, y, 2,
                          Color.rgb(83, 139, 120));
                  }

                  rect(c, 0, ground, w, h - ground,
                      Color.rgb(27, 30, 39));

                  rect(c, 0, ground, w, 5,
                      Color.rgb(70, 95, 74));

                  for (int i = 0; i < w / 16 + 2; i++) {
                      float x = i * 16 - (cameraX % 16);
                      pixel(c, x, ground + 12, 8,
                          Color.rgb(41, 47, 48));
                  }
              }

              private void drawLevi(Canvas c, float x, float y) {
                  float s = Math.max(2, getWidth() / 240f);

                  // Shadow
                  rect(c, x - 10*s, y + 65*s, 30*s, 5*s,
                      Color.rgb(4, 5, 8));

                  // Legs
                  rect(c, x - 2*s, y + 43*s, 8*s, 23*s,
                      Color.rgb(28, 30, 39));
                  rect(c, x + 7*s, y + 43*s, 8*s, 23*s,
                      Color.rgb(28, 30, 39));

                  // Boots
                  rect(c, x - 4*s, y + 61*s, 11*s, 6*s,
                      Color.rgb(12, 13, 20));
                  rect(c, x + 6*s, y + 61*s, 13*s, 6*s,
                      Color.rgb(12, 13, 20));

                  // Black armor
                  rect(c, x - 5*s, y + 23*s, 25*s, 23*s,
                      Color.rgb(35, 39, 53));

                  rect(c, x - 8*s, y + 27*s, 8*s, 17*s,
                      Color.rgb(20, 24, 37));

                  rect(c, x + 17*s, y + 27*s, 8*s, 17*s,
                      Color.rgb(20, 24, 37));

                  // Armor highlights
                  pixel(c, x - 3*s, y + 25*s, 5*s,
                      Color.rgb(107, 113, 137));

                  pixel(c, x + 11*s, y + 33*s, 5*s,
                      Color.rgb(112, 118, 137));

                  // Neck
                  rect(c, x + 3*s, y + 16*s, 10*s, 9*s,
                      Color.rgb(218, 166, 139));

                  // Face
                  rect(c, x, y + 2*s, 17*s, 18*s,
                      Color.rgb(235, 190, 159));

                  // White hair
                  rect(c, x - 3*s, y - 3*s, 21*s, 9*s,
                      Color.rgb(225, 229, 237));

                  pixel(c, x - 5*s, y + 3*s, 7*s,
                      Color.rgb(201, 208, 221));

                  pixel(c, x + 13*s, y + 1*s, 7*s,
                      Color.rgb(240, 242, 248));

                  // Eyes
                  pixel(c, x + 11*s, y + 10*s, 3*s,
                      Color.rgb(80, 175, 200));

                  // First blade
                  rect(c, x + 25*s, y + 16*s, 4*s, 43*s,
                      Color.rgb(157, 205, 222));

                  rect(c, x + 26*s, y + 18*s, 2*s, 38*s,
                      Color.rgb(230, 245, 250));

                  rect(c, x + 22*s, y + 34*s, 9*s, 4*s,
                      Color.rgb(125, 85, 65));
              }

              private void drawHUD(Canvas c) {
                  float w = getWidth();

                  rect(c, 15, 15, 190, 42,
                      Color.argb(210, 10, 12, 22));

                  text(c, "LEVI", 25, 32, 14, Color.WHITE);

                  rect(c, 25, 39, 150, 9,
                      Color.rgb(60, 28, 38));

                  rect(c, 25, 39, 150 * playerHealth / 100f, 9,
                      Color.rgb(214, 48, 67));

                  text(c, "EPISODE " + episode,
                      w - 145, 35, 15, Color.WHITE);

                  float cardWidth = 75;
                  float start = w / 2 - 165;

                  String[] names = {"LEVI", "AVIAN", "MIRA", "REN"};

                  for (int i = 0; i < 4; i++) {
                      float x = start + i * 83;

                      rect(c, x, getHeight() - 62,
                          cardWidth, 48,
                          Color.argb(220, 15, 18, 29));

                      rect(c, x, getHeight() - 62,
                          cardWidth, 3,
                          i == 0 ? Color.CYAN : Color.rgb(103, 110, 142));

                      text(c, names[i], x + 7,
                          getHeight() - 33, 10, Color.WHITE);

                      rect(c, x + 7, getHeight() - 24,
                          60, 5, Color.rgb(65, 28, 40));

                      rect(c, x + 7, getHeight() - 24,
                          55, 5, Color.rgb(190, 55, 76));
                  }
              }

              private void drawDialogue(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();

                  rect(c, 18, h - 145, w - 36, 112,
                      Color.argb(235, 7, 9, 18));

                  rect(c, 18, h - 145, w - 36, 3,
                      Color.rgb(107, 159, 192));

                  text(c, currentSpeaker, 35, h - 115,
                      15, Color.rgb(130, 207, 235));

                  text(c, currentText, 35, h - 78,
                      17, Color.WHITE);

                  text(c, "TAP TO CONTINUE",
                      w - 170, h - 45, 10,
                      Color.rgb(150, 157, 180));
              }

              private void drawMenu(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();

                  c.drawColor(Color.rgb(7, 8, 17));

                  text(c, "ILARION", w * 0.32f, h * 0.28f,
                      55, Color.rgb(222, 229, 244));

                  text(c, "THE WAR OF GODS",
                      w * 0.35f, h * 0.35f,
                      18, Color.rgb(112, 171, 205));

                  rect(c, w * 0.30f, h * 0.48f,
                      w * 0.40f, 55,
                      Color.rgb(34, 49, 70));

                  text(c, "NEW GAME",
                      w * 0.43f, h * 0.52f,
                      19, Color.WHITE);

                  rect(c, w * 0.30f, h * 0.62f,
                      w * 0.40f, 55,
                      Color.rgb(26, 31, 47));

                  text(c, "MULTIPLAYER",
                      w * 0.41f, h * 0.66f,
                      19, Color.WHITE);
              }

              private void drawGame(Canvas c) {
                  drawBackground(c);

                  c.save();
                  c.translate(-cameraX, 0);

                  drawLevi(c, playerX, playerY);

                  if (enemyHealth > 0) {
                      drawEnemy(c, playerX + 280);
                  }

                  c.restore();

                  drawHUD(c);
                  drawControls(c);

                  if (scene == 1) {
                      drawDialogue(c);
                  }
              }

              private void drawEnemy(Canvas c, float x) {
                  float y = ground - 100;

                  rect(c, x, y + 20, 45, 55,
                      Color.rgb(53, 26, 45));

                  rect(c, x + 5, y, 35, 35,
                      Color.rgb(80, 36, 53));

                  rect(c, x + 7, y + 11, 7, 5,
                      Color.rgb(255, 54, 67));

                  rect(c, x + 29, y + 11, 7, 5,
                      Color.rgb(255, 54, 67));

                  rect(c, x - 7, y + 68, 18, 15,
                      Color.rgb(34, 24, 35));

                  rect(c, x + 32, y + 68, 18, 15,
                      Color.rgb(34, 24, 35));
              }

              private void drawControls(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();

                  rect(c, 28, h - 115, 65, 65,
                      Color.argb(125, 100, 120, 150));

                  text(c, "<", 48, h - 75, 30, Color.WHITE);

                  rect(c, 105, h - 115, 65, 65,
                      Color.argb(125, 100, 120, 150));

                  text(c, ">", 125, h - 75, 30, Color.WHITE);

                  rect(c, w - 110, h - 120, 80, 75,
                      Color.argb(170, 135, 48, 62));

                  text(c, "ATK", w - 90, h - 75,
                      17, Color.WHITE);

                  rect(c, w - 205, h - 95, 65, 60,
                      Color.argb(130, 70, 110, 160));

                  text(c, "JUMP", w - 197, h - 60,
                      12, Color.WHITE);
              }

              private void nextDialogue() {
                  dialogue++;

                  if (dialogue >= intro.length) {
                      scene = 2;
                      dialogue = 0;
                      currentText = "";
                      return;
                  }

                  currentSpeaker = "NARRATOR";
                  currentText = intro[dialogue];
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);

                  ground = getHeight() * 0.78f;

                  if (scene == 0) {
                      drawMenu(canvas);
                  } else {
                      drawGame(canvas);
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  float x = event.getX();
                  float y = event.getY();

                  float w = getWidth();
                  float h = getHeight();

                  if (event.getAction() == MotionEvent.ACTION_DOWN) {

                      if (scene == 0) {
                          if (y > h * 0.42f) {
                              scene = 1;
                              dialogue = 0;
                              currentSpeaker = "NARRATOR";
                              currentText = intro[0];
                          }
                          invalidate();
                          return true;
                      }

                      if (scene == 1) {
                          nextDialogue();
                          invalidate();
                          return true;
                      }

                      if (x < 95 && y > h - 140) {
                          movingLeft = true;
                      } else if (x < 185 && y > h - 140) {
                          movingRight = true;
                      } else if (x > w - 120 && y > h - 140) {
                          attacking = true;
                      } else if (x > w - 220 && y > h - 115) {
                          if (playerY >= ground - 71) {
                              velocityY = -440;
                          }
                      }

                      return true;
                  }

                  if (event.getAction() == MotionEvent.ACTION_UP ||
                      event.getAction() == MotionEvent.ACTION_CANCEL) {

                      movingLeft = false;
                      movingRight = false;
                      attacking = false;

                      return true;
                  }

                  return true;
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Add Pixel Art Character Animation System
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/ilarion/game/GameSprites.java")

          path.write_text(r'''
          package com.ilarion.game;

          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Color;
          import java.util.Random;

          public final class GameSprites {

              private GameSprites() {}

              private static final Paint paint = new Paint();

              public static void pixel(Canvas c, Paint p,
                                       int x, int y, int color, int size) {
                  p.setColor(color);
                  p.setStyle(Paint.Style.FILL);
                  p.setAntiAlias(false);
                  c.drawRect(x, y, x + size, y + size, p);
              }

              public static void drawLevi(Canvas c, Paint p,
                                          float x, float y,
                                          int frame, int size) {

                  int armor = Color.rgb(37, 40, 55);
                  int dark = Color.rgb(15, 17, 28);
                  int silver = Color.rgb(210, 220, 232);
                  int skin = Color.rgb(235, 190, 158);

                  int step = frame % 2 == 0 ? 0 : size;

                  pixel(c, p, (int)x, (int)y, dark, size * 12);

                  pixel(c, p, (int)x + size * 3,
                        (int)y - size * 15, silver, size * 6);

                  pixel(c, p, (int)x + size * 2,
                        (int)y - size * 12, silver, size * 8);

                  pixel(c, p, (int)x + size * 4,
                        (int)y - size * 9, skin, size * 5);

                  pixel(c, p, (int)x + size * 3,
                        (int)y - size * 5, armor, size * 7);

                  pixel(c, p, (int)x + size * 2,
                        (int)y - size * 4, dark, size * 2);

                  pixel(c, p, (int)x + size * 8,
                        (int)y - size * 4, dark, size * 2);

                  pixel(c, p, (int)x + size * 3,
                        (int)y - size * 1, armor, size * 3);

                  pixel(c, p, (int)x + size * 7,
                        (int)y - size * 1, armor, size * 3);

                  pixel(c, p, (int)x + size * 4,
                        (int)y - size * 11, silver, size * 2);

                  pixel(c, p, (int)x + size * 7,
                        (int)y - size * 10, Color.rgb(75, 174, 211), size);

                  pixel(c, p, (int)x + size * 9,
                        (int)y - size * 3, Color.rgb(175, 205, 225), size);

                  pixel(c, p, (int)x + size * 10,
                        (int)y - size * 8, silver, size);

                  pixel(c, p, (int)x + size * 3 + step,
                        (int)y + size, dark, size * 2);

                  pixel(c, p, (int)x + size * 7 - step,
                        (int)y + size, dark, size * 2);
              }

              public static void drawAvian(Canvas c, Paint p,
                                           float x, float y,
                                           int frame, int size) {

                  int hair = Color.rgb(238, 180, 190);
                  int skin = Color.rgb(248, 202, 180);
                  int clothes = Color.rgb(65, 85, 135);
                  int dark = Color.rgb(23, 29, 49);

                  pixel(c, p, (int)x, (int)y, dark, size * 10);

                  pixel(c, p, (int)x + size * 2,
                        (int)y - size * 13, hair, size * 7);

                  pixel(c, p, (int)x + size * 3,
                        (int)y - size * 10, skin, size * 5);

                  pixel(c, p, (int)x + size * 2,
                        (int)y - size * 5, clothes, size * 6);

                  pixel(c, p, (int)x + size * 2,
                        (int)y - size * 2, dark, size * 3);

                  pixel(c, p, (int)x + size * 6,
                        (int)y - size * 2, dark, size * 3);

                  pixel(c, p, (int)x + size * 7,
                        (int)y - size * 10, hair, size * 3);

                  pixel(c, p, (int)x + size * 3,
                        (int)y - size * 9, Color.rgb(90, 140, 220), size);

                  pixel(c, p, (int)x + size * 8,
                        (int)y - size * 7, Color.rgb(170, 205, 255), size);

                  pixel(c, p, (int)x + size * 9,
