          package com.ilarion.game;

          import java.util.ArrayList;
          import java.util.Random;

          public final class GameWorld {

              public static final int FOREST = 0;
              public static final int RUINS = 1;
              public static final int ARCADIA = 2;
              public static final int VOID = 3;
              public static final int DIVINE_ARENA = 4;

              public static final int SIREX = 0;
              public static final int ORDER_GUARD = 1;
              public static final int MEMORY_SHADE = 2;
              public static final int TWISTED_BEAST = 3;
              public static final int WAR_KNIGHT = 4;
              public static final int BOSS = 5;

              public static class Enemy {
                  public float x;
                  public float y;
                  public float health;
                  public float maxHealth;
                  public float speed;
                  public float attackTimer;
                  public int type;
                  public boolean alive;
                  public boolean facingLeft;

                  public Enemy(float x, float y, int type,
                               float health, float speed) {
                      this.x = x;
                      this.y = y;
                      this.type = type;
                      this.health = health;
                      this.maxHealth = health;
                      this.speed = speed;
                      this.alive = true;
                  }

                  public void damage(float amount) {
                      if (!alive) return;
                      health -= amount;
                      if (health <= 0) {
                          health = 0;
                          alive = false;
                      }
                  }
              }

              public static class Particle {
                  public float x;
                  public float y;
                  public float vx;
                  public float vy;
                  public float life;
                  public int color;

                  public Particle(float x, float y,
                                  float vx, float vy,
                                  float life, int color) {
                      this.x = x;
                      this.y = y;
                      this.vx = vx;
                      this.vy = vy;
                      this.life = life;
                      this.color = color;
                  }

                  public void update(float dt) {
                      x += vx * dt;
                      y += vy * dt;
                      vy += 60 * dt;
                      life -= dt;
                  }
              }

              private final ArrayList<Enemy> enemies =
                  new ArrayList<>();

              private final ArrayList<Particle> particles =
                  new ArrayList<>();

              private final Random random = new Random();

              private int worldType = FOREST;
              private float worldWidth = 5000;
              private float spawnTimer = 0;

              public void setWorld(int type, float width) {
                  worldType = type;
                  worldWidth = Math.max(1000, width);
                  enemies.clear();
                  particles.clear();
                  spawnTimer = 0;
              }

              public int getWorldType() {
                  return worldType;
              }

              public float getWorldWidth() {
                  return worldWidth;
              }

              public ArrayList<Enemy> getEnemies() {
                  return enemies;
              }

              public ArrayList<Particle> getParticles() {
                  return particles;
              }

              public void spawnEnemy(float x, float y, int type) {
                  float hp;
                  float speed;

                  switch (type) {
                      case ORDER_GUARD:
                          hp = 130;
                          speed = 55;
                          break;

                      case MEMORY_SHADE:
                          hp = 90;
                          speed = 85;
                          break;

                      case TWISTED_BEAST:
                          hp = 180;
                          speed = 100;
                          break;

                      case WAR_KNIGHT:
                          hp = 250;
                          speed = 65;
                          break;

                      case BOSS:
                          hp = 2500;
                          speed = 45;
                          break;

                      default:
                          hp = 100;
                          speed = 75;
                          break;
                  }

                  enemies.add(new Enemy(x, y, type, hp, speed));
              }

              public void spawnEpisodeEnemies(int episode,
                                              float ground) {
                  enemies.clear();

                  int count = 5 + Math.min(episode, 10);

                  for (int i = 0; i < count; i++) {
                      int type;

                      if (episode <= 4) {
                          type = SIREX;
                      } else if (episode <= 8) {
                          type = MEMORY_SHADE;
                      } else if (episode <= 12) {
                          type = ORDER_GUARD;
                      } else if (episode <= 16) {
                          type = TWISTED_BEAST;
                      } else {
                          type = WAR_KNIGHT;
                      }

                      float x = 450 + i * 270;
                      spawnEnemy(x, ground, type);
                  }

                  if (episode == 5 || episode == 7 ||
                      episode == 13 || episode == 17 ||
                      episode == 24) {

                      int bossType = episode == 5 ? ORDER_GUARD :
                                     episode == 7 ? MEMORY_SHADE :
                                     episode == 13 ? TWISTED_BEAST :
                                     episode == 17 ? WAR_KNIGHT :
                                     BOSS;

                      spawnEnemy(worldWidth - 500,
                                 ground, bossType == BOSS ?
                                 BOSS : bossType);
                  }
              }

              public void update(float dt, float playerX,
                                 float playerY, float ground) {

                  spawnTimer += dt;

                  for (Enemy enemy : enemies) {
                      if (!enemy.alive) continue;

                      float distance = playerX - enemy.x;

                      enemy.facingLeft = distance < 0;

                      if (Math.abs(distance) > 48) {
                          enemy.x += Math.signum(distance) *
                              enemy.speed * dt;
                      } else {
                          enemy.attackTimer += dt;
                      }

                      if (enemy.attackTimer > 1.4f) {
                          enemy.attackTimer = 0;
                      }

                      enemy.y = ground;
                  }

                  for (int i = particles.size() - 1; i >= 0; i--) {
                      Particle particle = particles.get(i);
                      particle.update(dt);

                      if (particle.life <= 0) {
                          particles.remove(i);
                      }
                  }

                  for (int i = enemies.size() - 1; i >= 0; i--) {
                      if (!enemies.get(i).alive) {
                          enemies.remove(i);
                      }
                  }
              }

              public void createHitEffect(float x, float y) {
                  for (int i = 0; i < 12; i++) {
                      float angle = random.nextFloat() *
                          (float)Math.PI * 2;

                      float speed = 50 + random.nextFloat() * 130;

                      float vx = (float)Math.cos(angle) * speed;
                      float vy = (float)Math.sin(angle) * speed;

                      particles.add(new Particle(
                          x, y, vx, vy, 0.35f,
                          0xFF9AD9FF
                      ));
                  }
              }

              public void createDeathEffect(float x, float y) {
                  for (int i = 0; i < 25; i++) {
                      float angle = random.nextFloat() *
                          (float)Math.PI * 2;

                      float speed = 40 + random.nextFloat() * 170;

                      particles.add(new Particle(
                          x, y,
                          (float)Math.cos(angle) * speed,
                          (float)Math.sin(angle) * speed,
                          0.8f,
                          0xFFB45A85
                      ));
                  }
              }

              public boolean hasEnemies() {
                  return !enemies.isEmpty();
              }

              public void clearEnemies() {
                  enemies.clear();
              }
          }
