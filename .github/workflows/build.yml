              }

              private static final int MENU = 0;
              private static final int GAME = 1;
              private static final int PAUSED = 2;
              private static final int ROOM = 3;

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final SharedPreferences preferences;
              private final ToneGenerator tone;

              private Listener listener;
              private int screen = MENU;
              private boolean soundEnabled = true;
              private boolean controlsEnabled = true;
              private String roomAddress = "لم يتم إنشاء غرفة";
              private String statusMessage = "استعد للمعركة";
              private float touchX;
              private float touchY;
              private float scaleX = 1f;
              private float scaleY = 1f;

              private RectF singleButton;
              private RectF hostButton;
              private RectF joinButton;
              private RectF soundButton;
              private RectF resumeButton;
              private RectF pauseButton;
              private RectF leftButton;
              private RectF rightButton;
              private RectF jumpButton;
              private RectF attackButton;

              private boolean movingLeft;
              private boolean movingRight;

              public GameUI(Context context) {
                  super(context);

                  preferences = context.getSharedPreferences(
                          "ilarion_settings", Context.MODE_PRIVATE);

                  soundEnabled = preferences.getBoolean(
                          "sound_enabled", true);

