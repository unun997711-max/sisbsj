          package com.ilarion.game;

          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Random;

          public final class DivineBosses {

              public enum BossType {
                  SERAPHON,
                  MORGANETH,
                  EVRA,
                  DRAKON,
                  VOID_EMPEROR
              }

              public enum EnemyType {
                  SHADOW,
                  DEMON,
                  KNIGHT,
                  ARCHER,
                  WRAITH,
                  GUARDIAN
              }

              public static final class Enemy {
                  public float x;
                  public float y;
                  public float hp;
                  public float maxHp;
                  public float speed;
                  public float damage;
                  public float attackCooldown;
                  public float attackTimer;
                  public float animation;
                  public float knockback;
                  public int direction = 1;
                  public boolean alive = true;
                  public boolean attacking;
                  public EnemyType type;

                  Enemy(EnemyType type, float x, float y, float hp,
                        float speed, float damage) {
                      this.type = type;
                      this.x = x;
                      this.y = y;
                      this.hp = hp;
                      this.maxHp = hp;
                      this.speed = speed;
                      this.damage = damage;
                      this.attackCooldown = 1.2f;
                  }

                  public void hurt(float amount, float force) {
                      if (!alive) return;
                      hp -= Math.max(0, amount);
                      knockback = force;
                      if (hp <= 0) {
                          hp = 0;
                          alive = false;
                      }
                  }
              }

              public static final class Boss {
                  public final BossType type;
                  public String name;
                  public float x;
                  public float y;
                  public float hp;
                  public float maxHp;
                  public float damage;
                  public float speed;
                  public float phase;
                  public float attackTimer;
                  public float specialTimer;
                  public float animation;
                  public float flashTimer;
                  public int direction = -1;
                  public int attackPattern;
                  public boolean alive = true;
                  public boolean enraged;
                  public boolean defeated;

                  Boss(BossType type, String name, float hp,
                       float damage, float speed) {
                      this.type = type;
                      this.name = name;
                      this.hp = hp;
                      this.maxHp = hp;
                      this.damage = damage;
                      this.speed = speed;
                      this.attackTimer = 1.5f;
                      this.specialTimer = 4f;
                  }

                  public float healthPercent() {
                      return maxHp <= 0 ? 0 : hp / maxHp;
                  }

                  public void takeDamage(float amount) {
                      if (!alive) return;
                      hp -= Math.max(0, amount);
                      flashTimer = 0.15f;
                      if (healthPercent() <= 0.35f) {
                          enraged = true;
                          speed *= 1.0005f;
                      }
                      if (hp <= 0) {
                          hp = 0;
                          alive = false;
                          defeated = true;
                      }
                  }
              }

              public static final class Projectile {
                  public float x;
                  public float y;
                  public float vx;
                  public float vy;
                  public float radius;
                  public float damage;
                  public float life = 4f;
                  public boolean hostile = true;
                  public boolean active = true;

                  Projectile(float x, float y, float vx, float vy,
                             float radius, float damage) {
                      this.x = x;
                      this.y = y;
                      this.vx = vx;
                      this.vy = vy;
                      this.radius = radius;
                      this.damage = damage;
                  }

                  void update(float dt) {
                      x += vx * dt;
                      y += vy * dt;
                      life -= dt;
                      if (life <= 0) active = false;
                  }
              }

              private final List<Enemy> enemies = new ArrayList<>();
              private final List<Projectile> projectiles = new ArrayList<>();
              private final Random random = new Random();
              private Boss boss;
              private float worldWidth = 5000;
              private float groundY = 500;
              private float spawnTimer;
              private int wave = 1;
              private int defeatedCount;

              public void configure(float width, float ground) {
                  worldWidth = Math.max(800, width);
                  groundY = ground;
              }

              public void clear() {
                  enemies.clear();
                  projectiles.clear();
                  boss = null;
                  spawnTimer = 0;
                  defeatedCount = 0;
                  wave = 1;
              }

              public void startWave(int waveNumber) {
                  wave = Math.max(1, waveNumber);
                  enemies.clear();
                  projectiles.clear();
                  int count = Math.min(18, 3 + wave * 2);
                  for (int i = 0; i < count; i++) {
                      float x = 450 + i * 180 + random.nextInt(100);
                      spawnEnemy(randomEnemy(), x);
                  }
                  if (wave % 5 == 0) {
                      spawnBoss(bossForWave(wave));
                  }
              }

              private EnemyType randomEnemy() {
                  int roll = random.nextInt(100);
                  if (roll < 28) return EnemyType.SHADOW;
                  if (roll < 48) return EnemyType.DEMON;
                  if (roll < 66) return EnemyType.KNIGHT;
                  if (roll < 82) return EnemyType.ARCHER;
                  if (roll < 94) return EnemyType.WRAITH;
                  return EnemyType.GUARDIAN;
              }

              public void spawnEnemy(EnemyType type, float x) {
                  float scale = 1f + Math.min(3f, wave * 0.08f);
                  float hp;
                  float speed;
                  float damage;
                  switch (type) {
                      case DEMON:
                          hp = 115; speed = 68; damage = 18;
                          break;
                      case KNIGHT:
                          hp = 180; speed = 38; damage = 25;
                          break;
                      case ARCHER:
                          hp = 75; speed = 42; damage = 14;
                          break;
                      case WRAITH:
                          hp = 90; speed = 82; damage = 20;
                          break;
                      case GUARDIAN:
                          hp = 240; speed = 28; damage = 32;
                          break;
                      default:
                          hp = 65; speed = 55; damage = 12;
                          break;
                  }
                  enemies.add(new Enemy(type, clamp(x, 80, worldWidth - 80),
                          groundY, hp * scale, speed, damage * scale));
              }

              private BossType bossForWave(int number) {
                  int index = ((number / 5) - 1) % 5;
                  return BossType.values()[index];
              }

              public void spawnBoss(BossType type) {
                  String name;
                  float hp;
                  float damage;
                  float speed;
                  switch (type) {
                      case SERAPHON:
                          name = "SERAPHON - THE FALLEN LIGHT";
                          hp = 1800; damage = 32; speed = 55;
                          break;
                      case MORGANETH:
                          name = "MORGANETH - LORD OF SHADOWS";
                          hp = 2400; damage = 38; speed = 62;
                          break;
                      case EVRA:
                          name = "EVRA - THE BLOOD ORACLE";
                          hp = 2100; damage = 35; speed = 78;
                          break;
                      case DRAKON:
                          name = "DRAKON - THE ETERNAL FLAME";
                          hp = 3200; damage = 48; speed = 48;
                          break;
                      default:
                          name = "THE VOID EMPEROR";
                          hp = 5000; damage = 60; speed = 70;
                          break;
                  }
                  boss = new Boss(type, name, hp, damage, speed);
                  boss.x = worldWidth - 300;
                  boss.y = groundY;
              }

              public void update(float dt, float playerX, float playerY) {
                  dt = Math.min(0.05f, Math.max(0, dt));
                  spawnTimer += dt;

                  Iterator<Enemy> iterator = enemies.iterator();
                  while (iterator.hasNext()) {
                      Enemy enemy = iterator.next();
                      if (!enemy.alive) {
                          defeatedCount++;
                          iterator.remove();
                          continue;
                      }
                      updateEnemy(enemy, dt, playerX, playerY);
                  }

                  for (Projectile projectile : projectiles) {
                      projectile.update(dt);
                  }
                  Iterator<Projectile> shots = projectiles.iterator();
                  while (shots.hasNext()) {
                      if (!shots.next().active) shots.remove();
                  }

                  if (boss != null && boss.alive) {
                      updateBoss(dt, playerX, playerY);
                  }
              }

              private void updateEnemy(Enemy enemy, float dt,
                                       float playerX, float playerY) {
                  enemy.animation += dt * 7f;
                  enemy.attackTimer -= dt;

                  if (enemy.knockback != 0) {
                      enemy.x += enemy.knockback * dt;
                      enemy.knockback *= Math.max(0, 1f - dt * 7f);
                      if (Math.abs(enemy.knockback) < 2) enemy.knockback = 0;
                  }

                  float dx = playerX - enemy.x;
                  float distance = Math.abs(dx);
                  enemy.direction = dx >= 0 ? 1 : -1;

                  if (enemy.type == EnemyType.ARCHER) {
                      if (distance > 250) {
                          enemy.x += enemy.direction * enemy.speed * dt;
                      } else if (distance < 160) {
                          enemy.x -= enemy.direction * enemy.speed * dt;
                      }
                      if (distance < 550 && enemy.attackTimer <= 0) {
                          float angle = (float) Math.atan2(
                                  playerY - enemy.y - 40, dx);
                          projectiles.add(new Projectile(
                                  enemy.x, enemy.y - 55,
                                  (float) Math.cos(angle) * 300,
                                  (float) Math.sin(angle) * 300,
                                  9, enemy.damage));
                          enemy.attackTimer = 2.2f;
                      }
                  } else {
                      if (distance > 58) {
                          enemy.x += enemy.direction * enemy.speed * dt;
                      } else if (enemy.attackTimer <= 0) {
                          enemy.attacking = true;
                          enemy.attackTimer = enemy.attackCooldown;
                      } else {
                          enemy.attacking = false;
                      }
                  }
                  enemy.x = clamp(enemy.x, 50, worldWidth - 50);
              }

              private void updateBoss(float dt, float playerX, float playerY) {
                  boss.animation += dt * 3f;
                  boss.attackTimer -= dt;
                  boss.specialTimer -= dt;
                  boss.flashTimer = Math.max(0, boss.flashTimer - dt);

                  float dx = playerX - boss.x;
                  boss.direction = dx >= 0 ? 1 : -1;
                  float distance = Math.abs(dx);
                  float speed = boss.speed * (boss.enraged ? 1.45f : 1f);

                  if (distance > 125) {
                      boss.x += boss.direction * speed * dt;
                  }

                  if (boss.attackTimer <= 0) {
                      if (distance < 175) {
                          boss.attackPattern = 1;
                          boss.attackTimer = boss.enraged ? 0.9f : 1.5f;
                      } else {
                          boss.attackPattern = 2;
                          boss.attackTimer = boss.enraged ? 1.4f : 2.2f;
                          fireAtPlayer(playerX, playerY);
                      }
                  }

                  if (boss.specialTimer <= 0) {
                      boss.attackPattern = 3;
                      boss.specialTimer = boss.enraged ? 3f : 5f;
                      specialAttack(playerX, playerY);
                  }

                  boss.x = clamp(boss.x, 100, worldWidth - 100);
              }

              private void fireAtPlayer(float playerX, float playerY) {
                  int count = boss.enraged ? 5 : 3;
                  for (int i = 0; i < count; i++) {
                      float spread = (i - (count - 1) / 2f) * 0.16f;
                      float angle = (float) Math.atan2(
                              playerY - boss.y - 80, playerX - boss.x) + spread;
                      projectiles.add(new Projectile(
                              boss.x, boss.y - 80,
                              (float) Math.cos(angle) * 360,
                              (float) Math.sin(angle) * 360,
                              15, boss.damage));
                  }
              }

              private void specialAttack(float playerX, float playerY) {
                  switch (boss.type) {
                      case SERAPHON:
                          for (int i = 0; i < 7; i++) {
                              projectiles.add(new Projectile(
                                      playerX - 180 + i * 60, 30,
                                      0, 260, 18, boss.damage * 0.8f));
                          }
                          break;
                      case MORGANETH:
                          for (int i = 0; i < 8; i++) {
                              float angle = (float) (Math.PI * 2 * i / 8);
                              projectiles.add(new Projectile(
                                      boss.x, boss.y - 70,
                                      (float) Math.cos(angle) * 230,
                                      (float) Math.sin(angle) * 230,
                                      16, boss.damage));
                          }
                          break;
                      case EVRA:
                          for (int i = 0; i < 4; i++) {
                              projectiles.add(new Projectile(
                                      boss.x + (i - 2) * 55, boss.y - 40,
                                      boss.direction * 260, -80 + i * 45,
                                      13, boss.damage));
                          }
                          break;
                      case DRAKON:
                          for (int i = 0; i < 9; i++) {
                              projectiles.add(new Projectile(
                                      boss.x, boss.y - 65,
                                      boss.direction * (180 + i * 18),
                                      -100 + i * 28, 19, boss.damage));
                          }
                          break;
                      default:
                          for (int i = 0; i < 12; i++) {
                              float angle = (float) (Math.PI * 2 * i / 12);
                              projectiles.add(new Projectile(
                                      boss.x, boss.y - 90,
                                      (float) Math.cos(angle) * 300,
                                      (float) Math.sin(angle) * 300,
                                      20, boss.damage));
                          }
                          break;
                  }
              }

              public void damageEnemies(float x, float y, float range,
                                        float damage, float knockback) {
                  for (Enemy enemy : enemies) {
                      if (!enemy.alive) continue;
                      float dx = enemy.x - x;
                      float dy = enemy.y - y;
                      if (dx * dx + dy * dy <= range * range) {
                          enemy.hurt(damage, Math.signum(dx) * knockback);
                      }
                  }
                  if (boss != null && boss.alive) {
                      float dx = boss.x - x;
                      float dy = boss.y - y;
                      if (dx * dx + dy * dy <= (range + 70) * (range + 70)) {
                          boss.takeDamage(damage * 0.55f);
                      }
                  }
              }

              public float checkProjectileHits(float playerX, float playerY,
                                               float radius) {
                  float totalDamage = 0;
                  for (Projectile projectile : projectiles) {
                      if (!projectile.active || !projectile.hostile) continue;
                      float dx = projectile.x - playerX;
                      float dy = projectile.y - playerY;
                      float reach = radius + projectile.radius;
                      if (dx * dx + dy * dy <= reach * reach) {
                          totalDamage += projectile.damage;
                          projectile.active = false;
                      }
                  }
                  return totalDamage;
              }

              public float checkEnemyContact(float playerX, float playerY,
                                             float radius) {
                  float damage = 0;
                  for (Enemy enemy : enemies) {
                      if (!enemy.alive) continue;
                      float dx = enemy.x - playerX;
                      float dy = enemy.y - playerY;
                      if (dx * dx + dy * dy < radius * radius
                              && enemy.attackTimer > 0.65f) {
                          damage += enemy.damage;
                      }
                  }
                  if (boss != null && boss.alive) {
                      float dx = boss.x - playerX;
                      float dy = boss.y - playerY;
                      if (dx * dx + dy * dy < (radius + 80) * (radius + 80)
                              && boss.attackPattern == 1) {
                          damage += boss.damage;
                      }
                  }
                  return damage;
              }

              public void draw(Canvas canvas, Paint paint, float cameraX) {
                  for (Enemy enemy : enemies) {
                      if (enemy.alive) drawEnemy(canvas, paint, enemy, cameraX);
                  }
                  for (Projectile projectile : projectiles) {
                      if (!projectile.active) continue;
                      paint.setColor(0xFFFF5733);
                      canvas.drawCircle(projectile.x - cameraX,
                              projectile.y, projectile.radius, paint);
                      paint.setColor(0xFFFFC36A);
                      canvas.drawCircle(projectile.x - cameraX,
                              projectile.y, projectile.radius * 0.45f, paint);
                  }
                  if (boss != null && boss.alive) {
                      drawBoss(canvas, paint, cameraX);
                  }
              }

              private void drawEnemy(Canvas canvas, Paint paint,
                                     Enemy enemy, float cameraX) {
                  float x = enemy.x - cameraX;
                  float y = enemy.y;
                  int body = 0xFF382B48;
                  int glow = 0xFFB23B67;
                  switch (enemy.type) {
                      case DEMON:
                          body = 0xFF792D35;
                          glow = 0xFFFF7048;
                          break;
                      case KNIGHT:
                          body = 0xFF505A70;
                          glow = 0xFFB7C5D8;
                          break;
                      case ARCHER:
                          body = 0xFF315C50;
                          glow = 0xFF8BE6A2;
                          break;
                      case WRAITH:
                          body = 0xFF4C467C;
                          glow = 0xFFB5A7FF;
                          break;
                      case GUARDIAN:
                          body = 0xFF76613D;
                          glow = 0xFFFFD17A;
                          break;
                      default:
                          break;
                  }
                  paint.setColor(body);
                  canvas.drawRect(x - 19, y - 57, x + 19, y, paint);
                  canvas.drawRect(x - 24, y - 49, x + 24, y - 22, paint);
                  paint.setColor(glow);
                  canvas.drawRect(x - 12, y - 47, x - 4, y - 39, paint);
                  canvas.drawRect(x + 4, y - 47, x + 12, y - 39, paint);
                  paint.setColor(0xFF17131E);
                  canvas.drawRect(x - 14, y - 15, x - 5, y, paint);
                  canvas.drawRect(x + 5, y - 15, x + 14, y, paint);

                  paint.setColor(0xFF160F1A);
                  canvas.drawRect(x - 22, y - 68, x + 22, y - 64, paint);
                  paint.setColor(0xFFB52D42);
                  canvas.drawRect(x - 22, y - 68,
                          x - 22 + 44 * Math.max(0, enemy.hp / enemy.maxHp),
                          y - 64, paint);
              }

              private void drawBoss(Canvas canvas, Paint paint, float cameraX) {
                  float x = boss.x - cameraX;
                  float y = boss.y;
                  int body;
                  int aura;
                  switch (boss.type) {
                      case SERAPHON:
                          body = 0xFFB7A66B;
                          aura = 0xFFFFE8A0;
                          break;
                      case MORGANETH:
                          body = 0xFF30203F;
                          aura = 0xFFAA4DDB;
                          break;
                      case EVRA:
                          body = 0xFF6C253B;
                          aura = 0xFFFF547A;
                          break;
                      case DRAKON:
                          body = 0xFF7A3023;
                          aura = 0xFFFF9B42;
                          break;
                      default:
                          body = 0xFF171321;
                          aura = 0xFF8B65FF;
                          break;
                  }

                  float pulse = (float) Math.sin(boss.animation) * 5f;
                  paint.setColor(0x55300055);
                  canvas.drawOval(new RectF(x - 75, y - 18,
                          x + 75, y + 8), paint);
                  paint.setColor(body);
                  canvas.drawRect(x - 48, y - 145 - pulse,
                          x + 48, y, paint);
                  canvas.drawRect(x - 65, y - 125,
                          x + 65, y - 62, paint);
                  canvas.drawRect(x - 40, y - 185 - pulse,
                          x + 40, y - 130, paint);

                  paint.setColor(aura);
                  canvas.drawRect(x - 28, y - 174 - pulse,
                          x - 13, y - 160 - pulse, paint);
                  canvas.drawRect(x + 13, y - 174 - pulse,
                          x + 28, y - 160 - pulse, paint);
                  canvas.drawRect(x - 80, y - 135,
                          x - 60, y - 75, paint);
                  canvas.drawRect(x + 60, y - 135,
                          x + 80, y - 75, paint);

                  if (boss.enraged) {
                      paint.setColor(0x66FF2222);
                      canvas.drawCircle(x, y - 90, 105 + pulse, paint);
                  }

                  float barWidth = 300;
                  float left = (canvas.getWidth() - barWidth) / 2f;
                  paint.setColor(0xFF201724);
                  canvas.drawRect(left, 24, left + barWidth, 40, paint);
                  paint.setColor(0xFFB52B50);
                  canvas.drawRect(left, 24,
                          left + barWidth * boss.healthPercent(), 40, paint);
                  paint.setColor(0xFFFFFFFF);
                  paint.setTextSize(18);
                  paint.setTextAlign(Paint.Align.CENTER);
                  canvas.drawText(boss.name, canvas.getWidth() / 2f, 18, paint);
                  paint.setTextAlign(Paint.Align.LEFT);
              }

              public List<Enemy> getEnemies() {
                  return enemies;
              }

              public List<Projectile> getProjectiles() {
                  return projectiles;
              }

              public Boss getBoss() {
                  return boss;
              }

              public int getDefeatedCount() {
                  return defeatedCount;
              }

              public int getWave() {
                  return wave;
              }

              public boolean isWaveCleared() {
                  return enemies.isEmpty() && (boss == null || !boss.alive);
              }

              public boolean hasBoss() {
                  return boss != null && boss.alive;
              }

              private static float clamp(float value, float min, float max) {
                  return Math.max(min, Math.min(max, value));
              }
          }
