          package com.ilarion.game;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class StoryCampaign {

              public static class DialogueLine {
                  public final String speaker;
                  public final String text;

                  public DialogueLine(String speaker, String text) {
                      this.speaker = speaker;
                      this.text = text;
                  }
              }

              public static class StoryChoice {
                  public final String text;
                  public final int nextScene;

                  public StoryChoice(String text, int nextScene) {
                      this.text = text;
                      this.nextScene = nextScene;
                  }
              }

              public static class Episode {
                  public final int number;
                  public final String title;
                  public final String description;
                  public final List<DialogueLine> dialogue = new ArrayList<>();
                  public final List<StoryChoice> choices = new ArrayList<>();
                  public boolean completed = false;
                  public boolean unlocked = false;

                  public Episode(int number, String title, String description) {
                      this.number = number;
                      this.title = title;
                      this.description = description;
                  }

                  public void addDialogue(String speaker, String text) {
                      dialogue.add(new DialogueLine(speaker, text));
                  }

                  public void addChoice(String text, int nextScene) {
                      choices.add(new StoryChoice(text, nextScene));
                  }
              }

              public static class Season {
                  public final int number;
                  public final String title;
                  public final String subtitle;
                  public final List<Episode> episodes = new ArrayList<>();
                  public boolean unlocked = false;

                  public Season(int number, String title, String subtitle) {
                      this.number = number;
                      this.title = title;
                      this.subtitle = subtitle;
                  }
              }

              private final List<Season> seasons = new ArrayList<>();
              private int currentSeason = 0;
              private int currentEpisode = 0;
              private int currentDialogue = 0;
              private int currentScene = 0;
              private boolean waitingForChoice = false;

              public StoryCampaign() {
                  buildCampaign();
              }

              private void buildCampaign() {
                  addSeason(1, "بداية إيلاريون", "THE AWAKENING");
                  addSeason(2, "حرب الآلهة", "WAR OF THE GODS");
                  addSeason(3, "عهد الظلال", "THE SHADOWS");
                  addSeason(4, "نهاية الخلق", "THE END OF CREATION");

                  seasons.get(0).unlocked = true;
                  seasons.get(0).episodes.get(0).unlocked = true;
              }

              private void addSeason(int number, String title, String subtitle) {
                  Season season = new Season(number, title, subtitle);

                  for (int i = 1; i <= 24; i++) {
                      String episodeTitle = getEpisodeTitle(number, i);
                      String description = getEpisodeDescription(number, i);

                      Episode episode = new Episode(i, episodeTitle, description);
                      populateEpisode(season, episode, i);
                      season.episodes.add(episode);
                  }

                  seasons.add(season);
              }

              private String getEpisodeTitle(int season, int episode) {
                  if (season == 2) {
                      if (episode == 1) return "بداية حرب الآلهة";
                      if (episode == 12) return "سقوط العرش";
                      if (episode == 24) return "نهاية الحرب";
                  }

                  if (season == 4) {
                      if (episode == 1) return "آخر فجر";
                      if (episode == 6) return "نداء الفراغ";
                      if (episode == 12) return "انكسار السماء";
                      if (episode == 18) return "مصير الآلهة";
                      if (episode == 24) return "نهاية الخلق";
                  }

                  return "الحلقة " + episode;
              }

              private String getEpisodeDescription(int season, int episode) {
                  if (season == 2) {
                      return "تتقدم أحداث حرب الآلهة، ويقترب إيلاريون من مواجهة مصيره.";
                  }

                  if (season == 4) {
                      return "تقترب نهاية الخلق، ويصبح قرار الأبطال أهم من أي وقت مضى.";
                  }

                  return "تتواصل رحلة أبطال إيلاريون وتنكشف أسرار العالم تدريجياً.";
              }

              private void populateEpisode(Season season, Episode episode, int number) {
                  if (season.number == 1 && number == 1) {
                      episode.addDialogue("Levi", "لا أعرف ما الذي ينتظرني خلف هذا الظلام...");
                      episode.addDialogue("Avian", "لن تواجه هذا الطريق وحدك. أنا معك.");
                      episode.addDialogue("Mira", "هناك قوة قديمة تتحرك في هذا العالم.");
                      episode.addDialogue("Ren", "علينا أن نعرف الحقيقة قبل فوات الأوان.");
                      episode.addDialogue("Levi", "إذن تبدأ رحلتنا الآن.");
                  } else if (season.number == 2 && number == 1) {
                      episode.addDialogue("Narrator", "بدأت حرب الآلهة، واهتز العالم تحت قوة السماء.");
                      episode.addDialogue("Levi", "لن أسمح لهذه الحرب أن تبتلع الأبرياء.");
                      episode.addDialogue("Avian", "علينا أن نبقى معاً مهما حدث.");
                      episode.addDialogue("Sirex", "القوة وحدها لن تنقذ هذا العالم.");
                  } else if (season.number == 4 && number == 24) {
                      episode.addDialogue("Narrator", "وصلت الحكاية إلى نهايتها. لم يعد الخلق كما كان.");
                      episode.addDialogue("Avian", "مهما كانت النهاية، لن أنسى ما عشنا.");
                      episode.addDialogue("Levi", "كل تضحية أوصلتنا إلى هذه اللحظة.");
                      episode.addDialogue("Narrator", "هنا تنتهي رحلة إيلاريون.");
                  } else {
                      episode.addDialogue("Narrator", episode.description);
                      episode.addDialogue("Levi", "لن أتراجع الآن.");
                      episode.addDialogue("Avian", "أنا أثق بك. لنكمل الطريق.");
                      episode.addDialogue("Mira", "يجب أن نكون مستعدين لما سيأتي.");
                      episode.addDialogue("Ren", "القرار لنا، والنتيجة ستغير كل شيء.");
                  }

                  episode.addChoice("متابعة القصة", 0);
                  episode.addChoice("الاستعداد للمعركة", 1);
              }

              public List<Season> getSeasons() {
                  return Collections.unmodifiableList(seasons);
              }

              public Season getCurrentSeason() {
                  if (currentSeason < 0 || currentSeason >= seasons.size()) {
                      return null;
                  }
                  return seasons.get(currentSeason);
              }

              public Episode getCurrentEpisode() {
                  Season season = getCurrentSeason();
                  if (season == null || currentEpisode >= season.episodes.size()) {
                      return null;
                  }
                  return season.episodes.get(currentEpisode);
              }

              public DialogueLine getCurrentDialogue() {
                  Episode episode = getCurrentEpisode();
                  if (episode == null || currentDialogue >= episode.dialogue.size()) {
                      return null;
                  }
                  return episode.dialogue.get(currentDialogue);
              }

              public boolean hasNextDialogue() {
                  Episode episode = getCurrentEpisode();
                  return episode != null && currentDialogue < episode.dialogue.size();
              }

              public DialogueLine nextDialogue() {
                  Episode episode = getCurrentEpisode();
                  if (episode == null || waitingForChoice) {
                      return null;
                  }

                  if (currentDialogue < episode.dialogue.size()) {
                      return episode.dialogue.get(currentDialogue++);
                  }

                  waitingForChoice = true;
                  return null;
              }

              public List<StoryChoice> getCurrentChoices() {
                  Episode episode = getCurrentEpisode();
                  if (episode == null || !waitingForChoice) {
                      return Collections.emptyList();
                  }
                  return Collections.unmodifiableList(episode.choices);
              }

              public boolean selectChoice(int choiceIndex) {
                  Episode episode = getCurrentEpisode();

                  if (episode == null || !waitingForChoice) {
                      return false;
                  }

                  if (choiceIndex < 0 || choiceIndex >= episode.choices.size()) {
                      return false;
                  }

                  StoryChoice choice = episode.choices.get(choiceIndex);
                  currentScene = choice.nextScene;
                  waitingForChoice = false;
                  completeCurrentEpisode();
                  return true;
              }

              public void completeCurrentEpisode() {
                  Episode episode = getCurrentEpisode();
                  if (episode == null) return;

                  episode.completed = true;
                  unlockNextEpisode();
              }

              private void unlockNextEpisode() {
                  Season season = getCurrentSeason();
                  if (season == null) return;

                  if (currentEpisode + 1 < season.episodes.size()) {
                      season.episodes.get(currentEpisode + 1).unlocked = true;
                  } else if (currentSeason + 1 < seasons.size()) {
                      Season nextSeason = seasons.get(currentSeason + 1);
                      nextSeason.unlocked = true;
                      if (!nextSeason.episodes.isEmpty()) {
                          nextSeason.episodes.get(0).unlocked = true;
                      }
                  }
              }

              public boolean startEpisode(int seasonNumber, int episodeNumber) {
                  int seasonIndex = seasonNumber - 1;
                  int episodeIndex = episodeNumber - 1;

                  if (seasonIndex < 0 || seasonIndex >= seasons.size()) {
                      return false;
                  }

                  Season season = seasons.get(seasonIndex);

                  if (!season.unlocked || episodeIndex < 0 ||
                      episodeIndex >= season.episodes.size()) {
                      return false;
                  }

                  Episode episode = season.episodes.get(episodeIndex);
                  if (!episode.unlocked) return false;

                  currentSeason = seasonIndex;
                  currentEpisode = episodeIndex;
                  currentDialogue = 0;
                  currentScene = 0;
                  waitingForChoice = false;
                  return true;
              }

              public boolean nextEpisode() {
                  Season season = getCurrentSeason();
                  if (season == null) return false;

                  if (currentEpisode + 1 < season.episodes.size()) {
                      Episode next = season.episodes.get(currentEpisode + 1);
                      if (!next.unlocked) return false;
                      currentEpisode++;
                  } else {
                      if (currentSeason + 1 >= seasons.size()) return false;
                      Season nextSeason = seasons.get(currentSeason + 1);
                      if (!nextSeason.unlocked || nextSeason.episodes.isEmpty()) {
                          return false;
                      }
                      currentSeason++;
                      currentEpisode = 0;
                  }

                  currentDialogue = 0;
                  currentScene = 0;
                  waitingForChoice = false;
                  return true;
              }

              public int getCurrentScene() {
                  return currentScene;
              }

              public int getCurrentSeasonNumber() {
                  return currentSeason + 1;
              }

              public int getCurrentEpisodeNumber() {
                  return currentEpisode + 1;
              }

              public int getCompletedEpisodeCount() {
                  int count = 0;
                  for (Season season : seasons) {
                      for (Episode episode : season.episodes) {
                          if (episode.completed) count++;
                      }
                  }
                  return count;
              }

              public int getTotalEpisodeCount() {
                  return seasons.size() * 24;
              }

              public int getProgressPercent() {
                  return getCompletedEpisodeCount() * 100 / getTotalEpisodeCount();
              }

              public boolean isWaitingForChoice() {
                  return waitingForChoice;
              }

              public String exportProgress() {
                  StringBuilder data = new StringBuilder();
                  data.append(currentSeason).append(",");
                  data.append(currentEpisode).append(",");

                  for (Season season : seasons) {
                      for (Episode episode : season.episodes) {
                          data.append(episode.unlocked ? "1" : "0");
                          data.append(episode.completed ? "1" : "0");
                          data.append(";");
                      }
                  }

                  return data.toString();
              }

              public boolean importProgress(String data) {
                  if (data == null || data.trim().isEmpty()) return false;

                  try {
                      String[] sections = data.split(",", 3);
                      if (sections.length != 3) return false;

                      int savedSeason = Integer.parseInt(sections[0]);
                      int savedEpisode = Integer.parseInt(sections[1]);

                      if (savedSeason < 0 || savedSeason >= seasons.size()) {
                          return false;
                      }

                      String[] states = sections[2].split(";");
                      int expected = getTotalEpisodeCount();
                      if (states.length < expected) return false;

                      int index = 0;
                      for (Season season : seasons) {
                          for (Episode episode : season.episodes) {
                              String state = states[index++];
                              if (state.length() < 2) return false;
                              episode.unlocked = state.charAt(0) == '1';
                              episode.completed = state.charAt(1) == '1';
                          }
                      }

                      if (savedEpisode < 0 ||
                          savedEpisode >= seasons.get(savedSeason).episodes.size()) {
                          return false;
                      }

                      if (!seasons.get(savedSeason).unlocked ||
                          !seasons.get(savedSeason).episodes.get(savedEpisode).unlocked) {
                          currentSeason = 0;
                          currentEpisode = 0;
                      } else {
                          currentSeason = savedSeason;
                          currentEpisode = savedEpisode;
                      }

                      currentDialogue = 0;
                      currentScene = 0;
                      waitingForChoice = false;
                      return true;
                  } catch (Exception error) {
                      return false;
                  }
              }

              public void resetCampaign() {
                  for (Season season : seasons) {
                      season.unlocked = false;
                      for (Episode episode : season.episodes) {
                          episode.unlocked = false;
                          episode.completed = false;
                      }
                  }

                  currentSeason = 0;
                  currentEpisode = 0;
                  currentDialogue = 0;
                  currentScene = 0;
                  waitingForChoice = false;

                  seasons.get(0).unlocked = true;
                  seasons.get(0).episodes.get(0).unlocked = true;
              }
          }
